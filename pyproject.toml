[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
markers = [
    "unit: fast pure unit tests with zero network or live disk I/O",
    "api: FastAPI TestClient router contract tests",
    "integration: multi-service end-to-end flows with isolated temp storage",
    "contract: structural contract checks against apps_script/Code.gs",
    "live_smoke: opt-in live Google Apps Script health probe",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
