<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GoogleSheet UI Auditor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                ice: '#c6d8ff',        // Soft lavender blue (accents, text, highlights)
                sky: '#71a9f7',        // Cornflower blue (action, focus, active states)
                amethyst: '#6b5ca5',   // Purple-violet (secondary, badges, soft glow)
                mulberry: '#72195a',   // Deep fuchsia rose (accents, gradients)
                wine: '#4c1036',       // Deep rich wine (containers, headers, borders)
                dark: '#130617',       // Midnight wine canvas background
                surface: '#1c0a22',    // Card / panel container background
                card: '#240f2c',       // Elevated card background
                input: '#120516',      // Form input & textarea background
                border: '#3d1645',     // Subtle container border
                borderHover: '#6b5ca5' // Border hover accent
              }
            },
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            }
          }
        }
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background-color: #130617;
        color: #f5f2f9;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      code, pre, textarea.mono-font, .mono-font {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Custom scrollbar with palette tones */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #130617;
      }
      ::-webkit-scrollbar-thumb {
        background: #4c1036;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #6b5ca5;
      }
    </style>
  </head>
  <body class="min-h-screen bg-brand-dark text-gray-100 antialiased selection:bg-brand-amethyst selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
