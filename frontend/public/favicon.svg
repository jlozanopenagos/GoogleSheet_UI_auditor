<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161c26" />
      <stop offset="100%" stop-color="#0b0f17" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#71a9f7" />
      <stop offset="50%" stop-color="#6b5ca5" />
      <stop offset="100%" stop-color="#72195a" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#c6d8ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#263042" stroke-width="2" />

  <!-- Sheet Grid Emblem -->
  <g transform="translate(10, 10)">
    <!-- Base Sheet Container -->
    <rect x="2" y="2" width="40" height="40" rx="8" fill="#1b2333" stroke="url(#sheetGrad)" stroke-width="2" />
    
    <!-- Header Row -->
    <rect x="2" y="2" width="40" height="11" rx="8" fill="url(#sheetGrad)" fill-opacity="0.25" />
    <line x1="2" y1="13" x2="42" y2="13" stroke="url(#sheetGrad)" stroke-width="1.5" />
    
    <!-- Grid Dividers -->
    <line x1="16" y1="2" x2="16" y2="42" stroke="#263042" stroke-width="1.5" />
    <line x1="28" y1="2" x2="28" y2="42" stroke="#263042" stroke-width="1.5" />
    <line x1="2" y1="23" x2="42" y2="23" stroke="#263042" stroke-width="1.5" />
    <line x1="2" y1="33" x2="42" y2="33" stroke="#263042" stroke-width="1.5" />
    
    <!-- Active Cells Highlight -->
    <rect x="18" y="15" width="8" height="6" rx="2" fill="#71a9f7" fill-opacity="0.8" />
    <rect x="30" y="25" width="10" height="6" rx="2" fill="#6b5ca5" fill-opacity="0.8" />
    <rect x="4" y="25" width="10" height="6" rx="2" fill="#72195a" fill-opacity="0.8" />
  </g>

  <!-- Gemini Sparkle Star Overlay in Top Right -->
  <g transform="translate(42, 6)" filter="url(#glow)">
    <path d="M8 0 C8 4.4 4.4 8 0 8 C4.4 8 8 11.6 8 16 C8 11.6 11.6 8 16 8 C11.6 8 8 4.4 8 0 Z" fill="url(#starGrad)" />
    <circle cx="8" cy="8" r="2" fill="#ffffff" />
  </g>
</svg>

